<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decodificador de Texto</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <header>
        <img class="imagem1" src="Logo.png" alt="logo Alura">
    </header>
    <main>
    <div class="conteiner">
        <section >
            <input id="texto" placeholder="Digite seu texto"></input>
            <p class="criterio"> <img src="exclamacao.png" alt="ponto de exclamação"> Letras minúsculas e sem acento.</p>
            <button id="criptografars"  onclick="criptografar">Criptografar</button>
            <button id="descriptografar" onclick="descriptografar"><p class="button">Descriptografar</p></button>
        </section>
    </div>
        <div class="resultado">
           
            <img src="LupaDePesquisa.png" alt="Pessoa com uma lupa">
            <h3>Nenhuma mensagem encontrada</h3>
            <p class="p">Digite um texto que você deseja criptografar ou descriptografar.</p>
            
            
        </div>
        <div class="mostrarResultado">
            <button id="Copiar" onclick="Copiar">Copiar</button>
        </div>
    </main>
    <footer>
        <h4>Desenvolvido por</h4>
        <h4><a href="https://www.linkedin.com/in/thiago-costa-5abc">Thiago Costa</a></h4>
    </footer>
   
    <script src="script.js"></script>
</body>
</html>
